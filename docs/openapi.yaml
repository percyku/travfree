openapi: 3.0.3
info:
  title: FreeTrav API
  version: 0.1.0
  description: |
    FreeTrav 旅遊電商的後端 API，仿照六角學院電商 API，讓既有前端不需修改即可串接。

    **這份文件是前後端的契約。** 修改 API 時先改這裡，後端實作完成後由契約測試確認回應符合本文件，
    前端只需依照本文件開發。

    ## 在本頁測試

    1. 展開「登入及驗證」→ `POST /admin/signin` → **Try it out**，以 `admin@gmail.com` / `Test123456` 登入。
    2. 複製回應中的 `token`，按右上角 **Authorize** 貼上。
    3. 之後的請求都會帶這個 token，重新整理頁面也會保留。

    ## 共通規則

    - **回應格式**：成功時 `success: true`；失敗時一律是 `{ success: false, message }`。
    - **寫入格式**：除了登入，寫入 API 的內容都包在 `{ "data": { ... } }` 裡，多傳的欄位（例如 `id`、`num`）會被忽略。
    - **分頁**：查詢參數 `page`，每頁 10 筆，新到舊。`page` 無效時視為第 1 頁，超過末頁時回傳最後一頁；
      沒有資料時 `total_pages` 與 `current_page` 都是 0。清單中每筆的 `num` 是它在整份清單中的名次。
    - **欄位命名**：混用 snake_case 與 camelCase（`origin_price`、`imageUrl`、`isPublic`），這是 Hexschool 的原樣，請照抄。
    - **時間單位不一致，請特別注意**：訂單與優惠券是 Unix **秒**；登入的 `expired` 是**毫秒**；
      文章的 `create_at` 原值保存（前端傳 `Date.now()` 毫秒）。
    - **金額**：都是整數，傳小數會回 400 `資料格式不正確`。
    - **認證**：`Authorization` header 放登入取得的 token，裸 token 或 `Bearer <token>` 皆可。
    - **角色**（Hexschool 沒有）：帳號可以同時有 `USER`（一般會員）與 `ADMIN`（管理者）。
      註冊的帳號是 `USER`；預設的 `admin@gmail.com` 只有 `ADMIN`。結帳需要 `USER`。
    - **購物車**（Hexschool 是全站共用一台）：每個訪客與會員各一台，訪客以 `X-Cart-Id` header 識別，見 `GET /api/cart`。
servers:
  - url: http://localhost:8080/v2
    description: 本機開發
tags:
  - name: '登入及驗證'
    description: 註冊、登入、登出、登入狀態檢查與會員資料
  - name: '管理控制台 - 產品 (Products)'
    description: 後台產品管理，需要 admin token
  - name: '管理控制台 - 訂單 (Orders)'
    description: 後台訂單管理，需要 admin token
  - name: '管理控制台 - 會員 (Users)'
    description: 後台會員列表與管理者權限，需要 admin token（Hexschool 沒有）
  - name: '管理控制台 - 優惠券 (Coupon)'
    description: 後台優惠券管理，需要 admin token
  - name: '管理控制台 - 上傳圖片 (Upload)'
    description: 後台圖片上傳，需要 admin token
  - name: '管理控制台 - 文章 (Article)'
    description: 後台文章管理，需要 admin token
  - name: '客戶購物 - 產品 (Products)'
    description: 前台產品瀏覽，只含上架產品
  - name: '客戶購物 - 購物車 (Cart)'
    description: 購物車，每個訪客與會員各一台，見 `GET /api/cart` 的說明
  - name: '客戶購物 - 優惠券 (Coupon)'
    description: 套用優惠券，前端在購物車頁使用
  - name: '客戶購物 - 結帳 (Order)'
    description: 結帳與查詢訂單
  - name: '客戶購物 - 付款 (Pay)'
    description: 付款，只標記狀態，前端在訂單成功頁使用
  - name: '客戶購物 - 文章 (Article)'
    description: 前台文章瀏覽，只含公開文章
  - name: '圖片檔案 (Uploads)'
    description: 讀取上傳的圖片（Hexschool 沒有這組，圖片存在他們的雲端）

paths:
  # ───────────────────────── 認證 ─────────────────────────
  /admin/signin:
    post:
      tags: ['登入及驗證']
      summary: 管理者登入
      description: |
        後台登入頁使用。Body **不包** `data`。帳號不存在與密碼錯誤回應相同，不透露是哪一項錯誤。
        密碼正確但帳號沒有 `ADMIN` 角色時回 403（Hexschool 沒有一般會員，所以沒有這項）。

        `username` 前後的空白會去掉並轉成小寫再比對。

        **登入次數限制**（Hexschool 沒有這項）：以下任一種達到上限就鎖 15 分鐘，期間回 429，**密碼正確也擋**。
        與 `POST /api/user/signin` 共用同一組計數。

        - 同一 IP 對同一帳號 15 分鐘內失敗 5 次。登入成功會歸零。
        - 同一 IP 不分帳號 15 分鐘內失敗 20 次。

        鎖定期間的請求不計入失敗次數；欄位空白的 400 與沒有權限的 403 也不計入。

        | 狀態碼 | message | 情境 |
        |---|---|---|
        | 400 | `登入失敗` | 帳號不存在或密碼錯誤 |
        | 400 | `username 屬性不得為空`、`password 屬性不得為空` | 欄位空白，多個時以 `、` 連接 |
        | 403 | `此帳號沒有後台權限` | 密碼正確但沒有 `ADMIN` 角色 |
        | 429 | `登入失敗次數過多，請 N 分鐘後再試` | 鎖定中 |
      operationId: signin
      security: []  # 公開
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigninInput' }
      responses:
        '200': { $ref: '#/components/responses/SigninSuccess' }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '登入失敗' }
        '403':
          description: 帳號沒有 `ADMIN` 角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '此帳號沒有後台權限' }
        '429': { $ref: '#/components/responses/TooManySigninAttempts' }
        default: { $ref: '#/components/responses/Failure' }

  /api/user/signup:
    post:
      tags: ['登入及驗證']
      summary: 會員註冊
      description: |
        Hexschool 沒有這支。建立 `USER` 角色的帳號，成功時直接登入，回應與登入相同。

        - `email` 前後的空白會去掉並轉成小寫，之後不能修改。大小寫不同的 email 視為同一個。
        - `password` 8–64 個字元，只能用英數與半形符號（不含空白），至少要有一個英文字母與一個數字。
        - `name` 去掉前後空白後 1–30 個字。

        多個欄位錯誤時，訊息排序後以 `、` 連接。

        | 狀態碼 | message | 情境 |
        |---|---|---|
        | 400 | `此 Email 已註冊` | email 已存在（不分大小寫） |
        | 400 | `email 屬性不得為空`、`email 格式不正確` | |
        | 400 | `password 屬性不得為空`、`密碼需為 8–64 個英數或半形符號，且至少包含一個英文字母與一個數字` | |
        | 400 | `name 屬性不得為空`、`name 不得超過 30 個字` | |
        | 400 | `data 屬性不得為空`、`資料格式不正確` | 沒有 `data` 或 JSON 錯誤 |
      operationId: signup
      security: []  # 公開
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/SignupInput' }
      responses:
        '200': { $ref: '#/components/responses/SigninSuccess' }
        '400':
          description: 請求內容錯誤或 email 已註冊
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '此 Email 已註冊' }
        default: { $ref: '#/components/responses/Failure' }

  /api/user/signin:
    post:
      tags: ['登入及驗證']
      summary: 會員登入
      description: |
        Hexschool 沒有這支。前台登入頁使用，任何角色的帳號都可以登入。Body 與回應和 `POST /admin/signin` 相同，
        也共用同一組登入次數限制。

        | 狀態碼 | message | 情境 |
        |---|---|---|
        | 400 | `登入失敗` | 帳號不存在或密碼錯誤 |
        | 400 | `username 屬性不得為空`、`password 屬性不得為空` | 欄位空白 |
        | 429 | `登入失敗次數過多，請 N 分鐘後再試` | 鎖定中 |
      operationId: memberSignin
      security: []  # 公開
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigninInput' }
      responses:
        '200': { $ref: '#/components/responses/SigninSuccess' }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '登入失敗' }
        '429': { $ref: '#/components/responses/TooManySigninAttempts' }
        default: { $ref: '#/components/responses/Failure' }

  /logout:
    post:
      tags: ['登入及驗證']
      summary: 登出
      description: 帶有效 token 時，該帳號**所有**既有 token 立即失效。沒帶或無效 token 也回 200。
      operationId: logout
      security: [{}, { Token: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { success: true, message: '已登出' }
        default: { $ref: '#/components/responses/Failure' }

  /api/user/check:
    post:
      tags: ['登入及驗證']
      summary: 檢查登入狀態
      description: |
        任何角色的 token 都可以使用。Hexschool 只回 `uid`；`email`、`name`、`roles` 是本專案加的，
        前端用 `roles` 判斷能不能進入後台。
      operationId: checkUser
      security: [{ Token: [] }]
      responses:
        '200':
          description: token 有效
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, uid, email, name, roles]
                properties:
                  success: { type: boolean, enum: [true] }
                  uid: { type: string, description: 帳號 id（UUID）, example: 3f1c2a8e-5b7d-4e2f-9a61-0c8d4b2e7f90 }
                  email: { type: string, example: admin@gmail.com }
                  name: { type: string, example: 管理者 }
                  roles:
                    type: array
                    description: 帳號的角色，不重複、順序不固定。升級為管理者的會員同時有 `USER` 與 `ADMIN`
                    minItems: 1
                    uniqueItems: true
                    items: { $ref: '#/components/schemas/Role' }
                    example: [ADMIN]
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /api/user/profile:
    get:
      tags: ['登入及驗證']
      summary: 讀取會員資料
      description: |
        Hexschool 沒有這支。會員中心與結帳的填寫資料頁使用，任何角色的 token 都可以使用。
        身分由 token 決定，網址不帶 id。
      operationId: getProfile
      security: [{ Token: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProfileSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }
    put:
      tags: ['登入及驗證']
      summary: 更新會員資料
      description: |
        Hexschool 沒有這支。整筆取代 `name`、`tel`、`address`；`tel` 或 `address` 沒帶或空字串時清除。
        `email` 不能修改，body 帶了也忽略。

        - `name` 去掉前後空白後 1–30 個字（與註冊相同）。
        - `tel` 去掉前後空白後為 8–20 個數字，或空字串。
        - `address` 去掉前後空白後最多 100 個字。

        多個欄位錯誤時，訊息排序後以 `、` 連接。

        | 狀態碼 | message | 情境 |
        |---|---|---|
        | 400 | `name 屬性不得為空`、`name 不得超過 30 個字` | |
        | 400 | `tel 需為 8–20 個數字` | |
        | 400 | `address 不得超過 100 個字` | |
        | 400 | `data 屬性不得為空`、`資料格式不正確` | 沒有 `data` 或 JSON 錯誤 |
        | 401 | `驗證錯誤, 請重新登入` | 沒有 token |
      operationId: updateProfile
      security: [{ Token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200': { $ref: '#/components/responses/ProfileSuccess' }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: 'tel 需為 8–20 個數字' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /api/user/password:
    put:
      tags: ['登入及驗證']
      summary: 變更密碼
      description: |
        Hexschool 沒有這支。成功後該帳號**所有**既有 token 失效（其他裝置要重新登入），
        回應與登入相同，帶新的 token 讓目前的裝置維持登入，前端要以它取代舊的 token。

        - `new_password` 的規則與註冊相同。
        - 目前的密碼錯誤計入登入失敗次數，與 `POST /api/user/signin` 共用同一組計數（IP + 帳號 email、IP 總量）。
          達到上限時回 429，期間登入也一樣被擋。

        檢查順序：欄位格式 → 鎖定（429）→ 目前的密碼 → 新舊是否相同。

        | 狀態碼 | message | 情境 |
        |---|---|---|
        | 400 | `password 屬性不得為空`、`new_password 屬性不得為空` | 欄位空白 |
        | 400 | `密碼需為 8–64 個英數或半形符號，且至少包含一個英文字母與一個數字` | 新密碼不符合規則 |
        | 400 | `目前的密碼不正確` | |
        | 400 | `新密碼不能與目前的密碼相同` | |
        | 400 | `data 屬性不得為空`、`資料格式不正確` | 沒有 `data` 或 JSON 錯誤 |
        | 401 | `驗證錯誤, 請重新登入` | 沒有 token |
        | 429 | `登入失敗次數過多，請 N 分鐘後再試` | 鎖定中 |
      operationId: changePassword
      security: [{ Token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/PasswordChangeInput' }
      responses:
        '200': { $ref: '#/components/responses/SigninSuccess' }
        '400':
          description: 請求內容錯誤或目前的密碼不正確
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '目前的密碼不正確' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManySigninAttempts' }
        default: { $ref: '#/components/responses/Failure' }

  # ───────────────────────── Admin 產品 ─────────────────────────
  /api/admin/products/all:
    get:
      tags: ['管理控制台 - 產品 (Products)']
      summary: 全部產品（不分頁）
      description: 包含未上架產品。`products` 是**以 id 為 key 的物件**，不是陣列，舊到新。
      operationId: adminListAllProducts
      security: [{ Token: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, products]
                properties:
                  success: { type: boolean, enum: [true] }
                  products:
                    type: object
                    additionalProperties: { $ref: '#/components/schemas/Product' }
                    example:
                      c0051992-48d9-4d8e-84f4-e0730626f0ab:
                        id: c0051992-48d9-4d8e-84f4-e0730626f0ab
                        title: 台北3日遊
                        category: 亞洲
                        unit: 台幣
                        origin_price: 50000
                        price: 40000
                        is_enabled: 1
                        imageUrl: 'https://images.unsplash.com/photo-1609147110688-83b5fd1288e8'
                        imagesUrl: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /api/admin/products:
    get:
      tags: ['管理控制台 - 產品 (Products)']
      summary: 產品分頁
      description: 包含未上架產品。
      operationId: adminListProducts
      security: [{ Token: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Category'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, products, pagination, messages]
                properties:
                  success: { type: boolean, enum: [true] }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  messages: { $ref: '#/components/schemas/Messages' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /api/admin/product:
    post:
      tags: ['管理控制台 - 產品 (Products)']
      summary: 新增產品
      operationId: adminCreateProduct
      security: [{ Token: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { success: true, message: '已建立產品' }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: 'title 屬性不得為空' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /api/admin/product/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: ['管理控制台 - 產品 (Products)']
      summary: 更新產品
      description: 整筆覆寫。id 不存在回 404 `id 不存在`。
      operationId: adminUpdateProduct
      security: [{ Token: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { success: true, message: '已更新產品' }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: 'price 不得小於 0' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: 'id 不存在' }
        default: { $ref: '#/components/responses/Failure' }
    delete:
      tags: ['管理控制台 - 產品 (Products)']
      summary: 刪除產品
      description: 同時移除購物車內的該產品；歷史訂單有快照，不受影響。id 不存在回 404 `找不到產品`。
      operationId: adminDeleteProduct
      security: [{ Token: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { success: true, message: '已刪除產品' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到產品' }
        default: { $ref: '#/components/responses/Failure' }

  # ───────────────────────── Admin 上傳 ─────────────────────────
  /api/admin/upload:
    post:
      tags: ['管理控制台 - 上傳圖片 (Upload)']
      summary: 上傳圖片
      description: |
        jpg、jpeg、png，3MB 以內。會檢查檔案內容是否與副檔名相符，存檔時以 UUID 重新命名。

        | 情境 | 回應 |
        |---|---|
        | 格式不符、空檔案、欄位名稱錯誤 | 400 `檔案格式錯誤` |
        | 超過 3MB | 400 `檔案大小不得超過 3MB` |
      operationId: adminUploadImage
      security: [{ Token: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file-to-upload]
              properties:
                file-to-upload: { type: string, format: binary }
      responses:
        '200':
          description: 上傳成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, imageUrl]
                properties:
                  success: { type: boolean, enum: [true] }
                  imageUrl:
                    type: string
                    description: 圖片網址，開頭由後端的 `app.public-base-url` 決定
                    example: http://localhost:8080/v2/uploads/0b6a4f1e-3c9d-4f0e-9b1a-2f7c8d9e0a1b.png
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '檔案格式錯誤' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /uploads/{filename}:
    get:
      tags: ['圖片檔案 (Uploads)']
      summary: 讀取上傳的圖片
      description: 公開。`imageUrl` 直接指向這裡。
      operationId: getUploadedImage
      security: []  # 公開
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 圖片
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到資源' }
        default: { $ref: '#/components/responses/Failure' }

  # ───────────────────────── Admin 文章 ─────────────────────────
  /api/admin/articles:
