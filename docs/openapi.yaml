      security: []  # 公開
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, articles, pagination, messages]
                properties:
                  success: { type: boolean, enum: [true] }
                  articles:
                    type: array
                    items: { $ref: '#/components/schemas/Article' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  messages: { $ref: '#/components/schemas/Messages' }
        default: { $ref: '#/components/responses/Failure' }

  /api/article/{id}:
    get:
      tags: ['客戶購物 - 文章 (Article)']
      summary: 單篇公開文章
      description: 含 `content`。不存在或未公開回 404 `找不到文章`。
      operationId: getArticle
      security: []  # 公開
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, article]
                properties:
                  success: { type: boolean, enum: [true] }
                  article: { $ref: '#/components/schemas/Article' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到文章' }
        default: { $ref: '#/components/responses/Failure' }

  # ───────────────────────── 購物車 ─────────────────────────
  /api/cart:
    get:
      tags: ['客戶購物 - 購物車 (Cart)']
      summary: 取得購物車
      description: |
        **每個訪客與會員各一台購物車**（Hexschool 是全站共用一台）。哪一台由呼叫者決定，購物車與優惠券的 API 都相同：

        | 請求 | 購物車 |
        |---|---|
        | 帶有效 token | 該帳號的購物車（忽略 `X-Cart-Id`） |
        | 沒有 token，帶 `X-Cart-Id` | 該訪客的購物車，第一次加入商品時建立 |
        | 都沒有 | 視為空的購物車；`POST /api/cart` 回 400 `缺少 X-Cart-Id` |

        沒有 token 且 `X-Cart-Id` 不是 UUID 時回 400 `X-Cart-Id 格式不正確`。
        登入後由前端呼叫 `POST /api/cart/merge`，把訪客購物車併入帳號的購物車。

        `total` 是原價小計、`final_total` 是折扣後小計，都依**目前售價**即時計算。
      operationId: getCart
      security: [{}, { Token: [] }]
      parameters: [{ $ref: '#/components/parameters/CartId' }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data, messages]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/Cart' }
                  messages: { $ref: '#/components/schemas/Messages' }
        default: { $ref: '#/components/responses/Failure' }
    post:
      tags: ['客戶購物 - 購物車 (Cart)']
      summary: 加入購物車
      description: |
        同一產品重複加入時**累加數量**。

        | 情境 | 回應 |
        |---|---|
        | 產品不存在 | 404 `找不到產品` |
        | 產品已下架 | 400 `產品已下架` |
        | `qty` 小於 1 | 400 `qty 不得小於 1` |
        | `qty` 或累加後超過 9999 | 400 `qty 不得大於 9999` |
        | 沒有 token 也沒有 `X-Cart-Id` | 400 `缺少 X-Cart-Id` |
        | `X-Cart-Id` 格式錯誤 | 400 `X-Cart-Id 格式不正確` |
      operationId: addToCart
      security: [{}, { Token: [] }]
      parameters: [{ $ref: '#/components/parameters/CartId' }]
      requestBody: { $ref: '#/components/requestBodies/CartInput' }
      responses:
        '200':
          description: 已加入購物車
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: 已加入購物車 }
                  data: { $ref: '#/components/schemas/LineItem' }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '產品已下架' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到產品' }
        default: { $ref: '#/components/responses/Failure' }

  /api/cart/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 購物車**品項** id（不是產品 id）
        schema: { type: string }
      - $ref: '#/components/parameters/CartId'
    put:
      tags: ['客戶購物 - 購物車 (Cart)']
      summary: 設定品項數量
      description: |
        直接設定數量（不累加）。

        | 情境 | 回應 |
        |---|---|
        | 品項不存在，或不在呼叫者的購物車 | 404 `找不到購物車品項` |
        | `product_id` 與品項不符 | 400 `product_id 與購物車品項不符` |
      operationId: updateCartItem
      security: [{}, { Token: [] }]
      requestBody: { $ref: '#/components/requestBodies/CartInput' }
      responses:
        '200':
          description: 已更新購物車
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: 已更新購物車 }
                  data:
                    type: object
                    additionalProperties: false
                    required: [product_id, qty]
                    properties:
                      product_id: { type: string, example: c0051992-48d9-4d8e-84f4-e0730626f0ab }
                      qty: { type: integer, example: 3 }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: 'product_id 與購物車品項不符' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到購物車品項' }
        default: { $ref: '#/components/responses/Failure' }
    delete:
      tags: ['客戶購物 - 購物車 (Cart)']
      summary: 刪除單一品項
      description: 品項不存在，或不在呼叫者的購物車時回 404 `找不到購物車品項`。
      operationId: deleteCartItem
      security: [{}, { Token: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { success: true, message: '已刪除' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到購物車品項' }
        default: { $ref: '#/components/responses/Failure' }

  /api/carts:
    delete:
      tags: ['客戶購物 - 購物車 (Cart)']
      summary: 清空購物車
      description: 只清空呼叫者的購物車。購物車不存在或已經是空的也回 200。
      operationId: clearCart
      security: [{}, { Token: [] }]
      parameters: [{ $ref: '#/components/parameters/CartId' }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { success: true, message: '已刪除' }
        default: { $ref: '#/components/responses/Failure' }

  /api/cart/merge:
    post:
      tags: ['客戶購物 - 購物車 (Cart)']
      summary: 登入後合併訪客購物車
      description: |
        Hexschool 沒有這支。前端在會員登入或註冊成功後呼叫，把 `X-Cart-Id` 的訪客購物車併入帳號的購物車，
        然後刪除訪客購物車。回應是合併後的購物車，格式與 `GET /api/cart` 相同。

        - 同一個產品的數量相加，超過 9999 時以 9999 計。優惠券以帳號購物車原本的為準。
        - 帳號購物車沒有的產品整列移過去，保留原本套用的優惠券。
        - 沒帶 `X-Cart-Id`、訪客購物車不存在或是空的，直接回傳帳號的購物車，所以重複呼叫不會重複合併。

        | 情境 | 回應 |
        |---|---|
        | 沒有 token | 401 `驗證錯誤, 請重新登入` |
        | `X-Cart-Id` 格式錯誤 | 400 `X-Cart-Id 格式不正確` |
      operationId: mergeCart
      security: [{ Token: [] }]
      parameters: [{ $ref: '#/components/parameters/CartId' }]
      responses:
        '200':
          description: 合併後的購物車
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data, messages]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/Cart' }
                  messages: { $ref: '#/components/schemas/Messages' }
        '400':
          description: '`X-Cart-Id` 格式錯誤'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: 'X-Cart-Id 格式不正確' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /api/coupon:
    post:
      tags: ['客戶購物 - 優惠券 (Coupon)']
      summary: 套用優惠券
      description: |
        只套用在**目前購物車內**的品項，之後才加入的品項不帶優惠。套用新的優惠券會取代舊的。
        每個品項 `final_total = round(total × percent ÷ 100)`。

        優惠券只在**啟用且未過期**時有效。套用後若被停用或過期，購物車立即不再折扣（品項也不出現 `coupon`），
        重新啟用後恢復；被刪除則從購物車移除。

        | 情境 | 回應 |
        |---|---|
        | 找不到或已停用 | 404 `找不到優惠券` |
        | 已過期 | 400 `優惠券已過期` |
        | 購物車是空的 | 400 `購物車無資料` |

        套用在呼叫者的購物車，識別方式見 `GET /api/cart`。
      operationId: applyCoupon
      security: [{}, { Token: [] }]
      parameters: [{ $ref: '#/components/parameters/CartId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [code]
                  properties:
                    code: { type: string, example: TEST80 }
      responses:
        '200':
          description: 已套用
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: '已套用優惠券:TEST80' }
                  data:
                    type: object
                    additionalProperties: false
                    required: [final_total]
                    properties:
                      final_total: { type: integer, format: int64, example: 96000 }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '優惠券已過期' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到優惠券' }
        default: { $ref: '#/components/responses/Failure' }
    delete:
      tags: ['客戶購物 - 優惠券 (Coupon)']
      summary: 移除已套用的優惠券
      description: 清除呼叫者購物車所有品項的優惠券，購物車回到售價。購物車沒有套用優惠券或是空的，同樣回 200。Hexschool 沒有這支 API。
      operationId: removeCoupon
      security: [{}, { Token: [] }]
      parameters: [{ $ref: '#/components/parameters/CartId' }]
      responses:
        '200':
          description: 已移除
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: 已移除優惠券 }
                  data:
                    type: object
                    additionalProperties: false
                    required: [final_total]
                    properties:
                      final_total: { type: integer, format: int64, description: 移除後的購物車總額, example: 120000 }
        default: { $ref: '#/components/responses/Failure' }

  # ───────────────────────── 訂單（前台） ─────────────────────────
  /api/order:
    post:
      tags: ['客戶購物 - 結帳 (Order)']
      summary: 結帳
      description: |
        **需要 `USER` 角色**（Hexschool 是公開的）。結帳的是帳號的購物車；在單一交易內建立訂單、
        記錄下單的帳號、寫入品項快照並清空該購物車。`user` 是收件資料，可以與帳號的姓名、email 不同。

        | 情境 | 回應 |
        |---|---|
        | 沒有 token | 401 `驗證錯誤, 請重新登入` |
        | 帳號沒有 `USER`（例如預設 admin） | 403 `無此權限` |
        | 購物車是空的 | 400 `購物車無資料` |
        | 購物車含已下架產品 | 400 `購物車內有已下架產品` |
        | 缺少 `user` | 400 `user 屬性不得為空` |
        | Email 格式錯誤 | 400 `email 格式不正確` |
        | 帶了 `final_total` 但與目前購物車金額不同 | 409 `訂單金額已變動，請重新確認` |

        **金額比對**：前端應帶上畫面顯示的 `final_total`。後台刪除或停用優惠券、優惠券過期、
        商品改價，都會讓購物車金額改變；不一致時回 409，不建立訂單、不清空購物車，
        前端重新讀取購物車讓顧客確認新金額。沒帶 `final_total` 則不比對。
      operationId: createOrder
      security: [{ Token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/OrderCreateInput' }
      responses:
        '200':
          description: 已建立訂單
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, message, total, create_at, orderId]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: 已建立訂單 }
                  total: { type: integer, format: int64, description: 折扣後總額, example: 96000 }
                  create_at: { type: integer, format: int64, description: Unix **秒**, example: 1793799389 }
                  orderId: { type: string, example: 51149043-3529-456d-93de-691e7cdf5d0d }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '購物車無資料' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 帳號沒有 `USER` 角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '無此權限' }
        '409':
          description: 購物車金額與 `final_total` 不同
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '訂單金額已變動，請重新確認' }
        default: { $ref: '#/components/responses/Failure' }

  /api/orders:
    get:
      tags: ['客戶購物 - 結帳 (Order)']
      summary: 訂單分頁（需要 admin）
      description: '**與 Hexschool 不同**：需要 admin token，因為回應含全部訂單的個資。每筆訂單含 `user_id`。'
      operationId: listOrders
      security: [{ Token: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { $ref: '#/components/responses/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Failure' }

  /api/order/{id}:
    get:
      tags: ['客戶購物 - 結帳 (Order)']
      summary: 單筆訂單
      description: '公開，訂單 id 是 UUID。**找不到時回 200 `{ success: true, order: null }`**，與 Hexschool 相同。'
      operationId: getOrder
      security: []  # 公開
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 成功（找不到時 `order` 為 null）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, order]
                properties:
                  success: { type: boolean, enum: [true] }
                  order:
                    description: 找不到時為 null
                    oneOf:
                      - $ref: '#/components/schemas/Order'
                      # OpenAPI 3.0 表示「只能是 null」的寫法
                      - type: object
                        nullable: true
                        enum: [null]
        default: { $ref: '#/components/responses/Failure' }

  /api/pay/{id}:
    post:
      tags: ['客戶購物 - 付款 (Pay)']
      summary: 付款
      description: |
        設定 `is_paid = true` 與 `paid_date`，只標記狀態，沒有串接金流。

        | 情境 | 回應 |
        |---|---|
        | 訂單不存在 | 404 `找不到訂單` |
        | 已付款 | 400 `訂單已付款` |
      operationId: payOrder
      security: []  # 公開
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { success: true, message: '付款完成' }
        '400':
          description: 請求內容錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '訂單已付款' }
        '404':
          description: 資源不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
              example: { success: false, message: '找不到訂單' }
        default: { $ref: '#/components/responses/Failure' }

components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: |
        登入或註冊取得的 token。裸 token 或 `Bearer <token>` 皆可。前端存在 cookie，但後端只讀這個 header。
        會員與管理者用同一種 token，需要哪個角色寫在各端點的說明；`/api/admin/**` 與 `GET /api/orders` 需要 `ADMIN`，
        角色不符時回 403 `無此權限`。

  parameters:
    CartId:
      name: X-Cart-Id
      in: header
      required: false
      description: |
        訪客購物車的識別，前端產生的 UUID（存在 localStorage）。Hexschool 沒有這項。
        **帶有效 token 時忽略**，改用帳號的購物車；只有 `POST /api/cart/merge` 會在登入時讀取它。
        沒有 token 時格式錯誤回 400 `X-Cart-Id 格式不正確`。
      schema: { type: string, format: uuid, example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d }
    Page:
      name: page
      in: query
      required: false
      description: 頁碼，從 1 開始。缺少、不是數字或小於 1 時視為第 1 頁；超過末頁回傳最後一頁。
      schema: { type: string, example: '1' }
    Category:
      name: category
      in: query
      required: false
      description: 分類名稱，完全相符才會列出。
      schema: { type: string, example: 亞洲 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }

  requestBodies:
    ProductInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ProductInput' }
    ArticleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ArticleInput' }
    CouponInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/CouponInput' }
    CartInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [product_id, qty]
                properties:
                  product_id: { type: string }
                  qty: { type: integer, minimum: 1, maximum: 9999 }

  responses:
    SigninSuccess:
      description: 登入成功
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [success, message, uid, token, expired]
            properties:
              success: { type: boolean, enum: [true] }
              message: { type: string, description: 登入為 `登入成功`，註冊為 `註冊成功`，變更密碼為 `已變更密碼`, example: 登入成功 }
              uid: { type: string, description: 帳號 id（UUID）, example: 3f1c2a8e-5b7d-4e2f-9a61-0c8d4b2e7f90 }
              token: { type: string, description: JWT，預設 7 天有效, example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbkBnbWFpbC5jb20ifQ.c2lnbmF0dXJl }
              expired:
                type: integer
                format: int64
                description: 到期時間，Unix **毫秒**，前端直接用來設定 cookie 期限
                example: 1793799088000
    ProfileSuccess:
      description: 成功。更新時 `message` 為 `已更新會員資料`
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [success, profile]
            properties:
              success: { type: boolean, enum: [true] }
              message: { type: string, description: 只有更新時出現, example: 已更新會員資料 }
              profile: { $ref: '#/components/schemas/Profile' }
    TooManySigninAttempts:
      description: 登入失敗次數過多，暫時鎖定
      headers:
        Retry-After:
          description: 距離解除鎖定的**秒**數
          required: true
          schema: { type: integer, minimum: 1, example: 900 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
          example: { success: false, message: '登入失敗次數過多，請 15 分鐘後再試' }
    OrderPage:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [success, orders, pagination, messages]
            properties:
              success: { type: boolean, enum: [true] }
              orders:
                type: array
                items: { $ref: '#/components/schemas/Order' }
              pagination: { $ref: '#/components/schemas/Pagination' }
              messages: { $ref: '#/components/schemas/Messages' }
    Unauthorized:
      description: 未帶 token、token 無效或已登出
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
          example: { success: false, message: '驗證錯誤, 請重新登入' }
    Failure:
      description: 其他錯誤（403、405、415、500 等），格式相同
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }

  # 範例取自 Hexschool react-week2-api 匯入的真實資料（2026-11-04）
  schemas:
    Failure:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false], example: false }
        message: { type: string, example: 找不到產品 }
    Message:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true], example: true }
        message: { type: string, example: 已建立產品 }
    Messages:
      type: array
      description: 固定為空陣列，比照 Hexschool 保留
      maxItems: 0
      items: {}
      example: []
    Pagination:
      type: object
      additionalProperties: false
      required: [total_pages, current_page, has_pre, has_next, category]
      properties:
        total_pages: { type: integer, minimum: 0, example: 3 }
        current_page: { type: integer, minimum: 0, description: 沒有資料時為 0, example: 1 }
        has_pre: { type: boolean, example: false }
        has_next: { type: boolean, example: true }
        category: { type: string, description: 查詢的分類，未指定時為空字串, example: '' }

    SigninInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: email，不分大小寫, example: admin@gmail.com }
        password: { type: string, example: Test123456 }
    SignupInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, example: traveler@example.com }
        password:
          type: string
          description: 8–64 個英數或半形符號（不含空白），至少一個英文字母與一個數字
          example: Travel2026
        name: { type: string, description: 去掉前後空白後 1–30 個字, example: 王小明 }
    Role:
      type: string
      enum: [USER, ADMIN]
      description: '`USER` 一般會員；`ADMIN` 管理者'
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, name, roles, create_at]
      properties:
        id: { type: string, description: 帳號 id（UUID）, example: 7a2d9c41-0e6b-4f3a-8d15-b6c0e2f4a937 }
        email: { type: string, example: traveler@example.com }
        name: { type: string, example: 王小明 }
        roles:
          type: array
          description: 不重複，依 `USER`、`ADMIN` 排列
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
          example: [USER, ADMIN]
        create_at: { type: integer, format: int64, description: 註冊時間，Unix **秒**, example: 1793799389 }
    Profile:
      type: object
      additionalProperties: false
      required: [email, name, tel, address]
      properties:
        email: { type: string, description: 不能修改, example: traveler@example.com }
        name: { type: string, example: 王小明 }
        tel: { type: string, description: 8–20 個數字；未填時為空字串, example: '0912345678' }
        address: { type: string, description: 最多 100 個字；未填時為空字串, example: 台北市信義區市府路1號 }
    ProfileInput:
      type: object
      required: [name]
      description: 多傳的欄位（例如 `email`）會被忽略
      properties:
        name: { type: string, description: 去掉前後空白後 1–30 個字, example: 王小明 }
        tel: { type: string, description: 去掉前後空白後 8–20 個數字；沒帶或空字串時清除, example: '0912345678' }
        address: { type: string, description: 去掉前後空白後最多 100 個字；沒帶或空字串時清除, example: 台北市信義區市府路1號 }
    PasswordChangeInput:
      type: object
      required: [password, new_password]
      properties:
        password: { type: string, description: 目前的密碼, example: Travel2026 }
        new_password:
          type: string
          description: 8–64 個英數或半形符號（不含空白），至少一個英文字母與一個數字，且不能與目前的密碼相同
          example: Journey2027

    Product:
      type: object
      additionalProperties: false
      required: [id, title, category, unit, origin_price, price, is_enabled, imagesUrl]
      properties:
        id: { type: string, example: c0051992-48d9-4d8e-84f4-e0730626f0ab }
        title: { type: string, example: 台北3日遊 }
        category: { type: string, example: 亞洲 }
        unit: { type: string, example: 台幣 }
        origin_price: { type: integer, example: 50000 }
        price: { type: integer, description: 售價, example: 40000 }
        description:
          type: string
          description: 未設定時不出現
          example: 台北交通極其便利，建議全程使用悠遊卡或手機綁定，搭乘捷運即可抵達 90% 的景點。
        content:
          type: string
          description: 未設定時不出現
          example: 台北是一座融合了殖民歷史、現代科技與溫暖人情味的城市。這趟三日行程，將帶領您從世界級的摩天大樓，穿梭至充滿煙火氣的傳統巷弄。
        is_enabled: { type: integer, enum: [0, 1], description: 1 為上架, example: 1 }
        imageUrl:
          type: string
          description: 主圖，未設定時不出現
          example: 'https://images.unsplash.com/photo-1609147110688-83b5fd1288e8'
        imagesUrl:
          type: array
          items: { type: string }
          example:
            - 'https://images.unsplash.com/photo-1519126400611-d57095205936'
            - 'https://images.unsplash.com/photo-1583889659384-64d9df2347ba'
        num: { type: integer, description: 只在分頁清單出現, example: 1 }
    ProductInput:
      type: object
      required: [title, category, unit, origin_price, price]
      properties:
        title: { type: string, example: 台北3日遊 }
        category: { type: string, example: 亞洲 }
        unit: { type: string, example: 台幣 }
        origin_price: { type: integer, minimum: 0, example: 50000 }
        price: { type: integer, minimum: 0, example: 40000 }
        description: { type: string, example: 台北交通極其便利，建議全程使用悠遊卡或手機綁定。 }
        content: { type: string, example: 台北是一座融合了殖民歷史、現代科技與溫暖人情味的城市。 }
        is_enabled: { type: integer, enum: [0, 1], description: 未傳視為 0, example: 1 }
        imageUrl: { type: string, example: 'https://images.unsplash.com/photo-1609147110688-83b5fd1288e8' }
        imagesUrl:
          type: array
          items: { type: string }
          description: 未傳視為空陣列
          example:
            - 'https://images.unsplash.com/photo-1519126400611-d57095205936'
            - 'https://images.unsplash.com/photo-1583889659384-64d9df2347ba'

    Article:
      type: object
      additionalProperties: false
      required: [id, title, description, tag, create_at, author, isPublic]
      properties:
        id: { type: string, example: db06bc3c-dee9-4684-a26d-d79b37ce3de1 }
        title: { type: string, example: 大英帝國巡禮 }
        description:
          type: string
          description: 摘要，顯示在首頁的文章卡片
          example: 倫敦旅遊必去大英博物館、倫敦塔、白金漢宮及搭乘倫敦眼，夏季（6-8月）天氣最舒適。
        image:
          type: string
          description: 未設定時不出現
          example: 'https://images.unsplash.com/photo-1533929736458-ca588d08c8be'
        tag:
          type: array
          items: { type: string }
          example: [歐洲]
        create_at:
          type: integer
          format: int64
          description: 原值保存，不換算單位。前端傳 `Date.now()`（毫秒）
          example: 1774092156547
        author: { type: string, example: Oscar }
        isPublic: { type: boolean, example: true }
        content:
          type: string
          description: 內文，純文字，換行以 `\n` 保存，前端不以 HTML 解析。前台清單不含；單篇與後台清單含
          example: 第一天從大英博物館開始，下午前往倫敦塔與塔橋……
        num: { type: integer, description: 只在分頁清單出現, example: 1 }
    ArticleInput:
      type: object
      required: [title, description, author, content, tag]
      properties:
        title: { type: string, example: 大英帝國巡禮 }
        description: { type: string, description: 摘要, example: 倫敦旅遊必去大英博物館、倫敦塔、白金漢宮及搭乘倫敦眼。 }
        image: { type: string, example: 'https://images.unsplash.com/photo-1533929736458-ca588d08c8be' }
        tag:
          type: array
          description: 分類，至少一個。未傳或空陣列回 400 `tag 至少選擇一個`
          minItems: 1
          items: { type: string }
          example: [歐洲]
        create_at:
          type: integer
          format: int64
          description: 新增時未傳則用目前毫秒；更新時未傳則保留原值
          example: 1774092156547
        author: { type: string, example: Oscar }
        isPublic: { type: boolean, example: true }
        content: { type: string, description: 內文，純文字, example: 第一天從大英博物館開始，下午前往倫敦塔與塔橋…… }

    Coupon:
      type: object
      additionalProperties: false
      required: [id, title, code, percent, due_date, is_enabled]
      properties:
        id: { type: string, example: 5a9d667c-ce0c-434b-836c-d2e6c591afbb }
        title: { type: string, example: 測試八折 }
        code: { type: string, example: TEST80 }
        percent: { type: integer, minimum: 0, maximum: 100, description: '**實付比例**，80 代表付 80%', example: 80 }
        due_date: { type: integer, format: int64, description: 到期時間，Unix **秒**, example: 1893456000 }
        is_enabled: { type: integer, enum: [0, 1], example: 1 }
        num: { type: integer, description: 只在分頁清單出現, example: 1 }
    CouponInput:
      type: object
      required: [title, code, percent, due_date]
      properties:
        title: { type: string, example: 測試八折 }
        code: { type: string, example: TEST80 }
        percent: { type: integer, minimum: 0, maximum: 100, example: 80 }
        due_date: { type: integer, format: int64, description: Unix **秒**, example: 1893456000 }
        is_enabled: { type: integer, enum: [0, 1], example: 1 }

    LineItem:
      type: object
      description: 購物車與訂單共用的品項格式
      additionalProperties: false
      required: [id, product_id, qty, total, final_total, product]
      properties:
        id: { type: string, description: 品項 id, example: e5c5dd83-4edf-40bd-8e50-e06d0c4bf144 }
        product_id: { type: string, example: c0051992-48d9-4d8e-84f4-e0730626f0ab }
        qty: { type: integer, example: 3 }
        total: { type: integer, format: int64, description: 原價小計, example: 120000 }
        final_total: { type: integer, format: int64, description: 折扣後小計, example: 96000 }
        coupon:
          allOf:
            - $ref: '#/components/schemas/Coupon'
          description: |
            購物車：有套用且優惠券仍有效（啟用且未過期）時才出現。
            訂單：下單當下的快照，之後修改、停用或刪除優惠券都不影響
        product: { $ref: '#/components/schemas/Product' }
    Cart:
      type: object
      additionalProperties: false
      required: [carts, total, final_total]
      properties:
        carts:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        total: { type: integer, format: int64, example: 120000 }
        final_total: { type: integer, format: int64, example: 96000 }

    OrderUser:
      type: object
      additionalProperties: false
      required: [name, email, tel, address]
      properties:
        name: { type: string, example: 王小明 }
        email: { type: string, format: email, example: test@example.com }
        tel: { type: string, example: '0912345678' }
        address: { type: string, example: 台北市信義區市府路1號 }
    OrderCreateInput:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [name, email, tel, address]
          description: 前端會在這裡多傳 `message`，會被忽略
          properties:
            name: { type: string, example: 王小明 }
            email: { type: string, format: email, example: test@example.com }
            tel: { type: string, example: '0912345678' }
            address: { type: string, example: 台北市信義區市府路1號 }
        message: { type: string, example: 希望安排靠窗座位 }
        final_total:
          type: integer
          format: int64
          description: 選填。前端畫面顯示的總計（折扣後），與後端計算不同時回 409。建議一律帶上
          example: 96000
    OrderUpdateInput:
      type: object
      description: 前端會傳整筆訂單，只有 `is_paid` 與 `status` 生效
      properties:
        is_paid: { type: boolean, example: true }
        status:
          description: 外送進度 0 未確認、1 已確認、2 外送中、3 已送達。前端從 `<select>` 送字串（`"2"`），也接受整數
          oneOf:
            - { type: integer, minimum: 0, maximum: 3 }
            - { type: string, enum: ['0', '1', '2', '3'] }
          example: '2'
    Order:
      type: object
      additionalProperties: false
      required: [id, create_at, is_paid, status, total, user, products]
      properties:
        id: { type: string, format: uuid, example: 51149043-3529-456d-93de-691e7cdf5d0d }
        create_at: { type: integer, format: int64, description: Unix **秒**, example: 1793799389 }
        is_paid: { type: boolean, example: true }
        paid_date: { type: integer, format: int64, description: 付款時間，Unix **秒**；未付款時不出現, example: 1793799389 }
        message: { type: string, description: 未填時不出現, example: 希望安排靠窗座位 }
        status: { type: integer, enum: [0, 1, 2, 3], example: 0 }
        total: { type: integer, format: int64, description: 折扣後總額, example: 96000 }
        user: { $ref: '#/components/schemas/OrderUser' }
        user_id:
          type: string
          description: |
            下單的帳號 id（UUID），Hexschool 沒有。**只在需要 admin 的訂單列表出現**（`GET /api/admin/orders`、`GET /api/orders`），
            前台的訂單 API 不回；會員系統之前的訂單沒有下單帳號，也不出現
          example: 7a2d9c41-0e6b-4f3a-8d15-b6c0e2f4a937
        products:
          type: object
          description: '**以品項 id 為 key 的物件**，不是陣列，前端用 `Object.values` 讀取'
          additionalProperties: { $ref: '#/components/schemas/LineItem' }
          example:
            e5c5dd83-4edf-40bd-8e50-e06d0c4bf144:
              id: e5c5dd83-4edf-40bd-8e50-e06d0c4bf144
              product_id: c0051992-48d9-4d8e-84f4-e0730626f0ab
              qty: 3
              total: 120000
              final_total: 96000
              coupon: { id: 5a9d667c-ce0c-434b-836c-d2e6c591afbb, title: 測試八折, code: TEST80, percent: 80, due_date: 1893456000, is_enabled: 1 }
              product:
                id: c0051992-48d9-4d8e-84f4-e0730626f0ab
                title: 台北3日遊
                category: 亞洲
                unit: 台幣
                origin_price: 50000
                price: 40000
                is_enabled: 1
                imageUrl: 'https://images.unsplash.com/photo-1609147110688-83b5fd1288e8'
                imagesUrl: []
        num: { type: integer, description: 只在分頁清單出現, example: 1 }
