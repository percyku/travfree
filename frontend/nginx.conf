server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 後端上限是 3MB；這裡放寬，讓超過 3MB 的檔案由後端回 JSON 錯誤，而不是 nginx 的 413 頁面
    client_max_body_size 10m;

    location /v2/ {
        proxy_pass http://backend:8080;
        # 含連接埠，後端才會把同網址的請求視為同源
        proxy_set_header Host $http_host;
        # 以真實 client IP 覆寫，不沿用 client 自己帶的值；後端的登入次數限制依此判斷
        proxy_set_header X-Forwarded-For $remote_addr;
        # 不帶 X-Forwarded-Proto：後端（Tomcat RemoteIpValve）收到它會把連接埠改成 80/443，
        # 非預設連接埠（例如 :8000）的同源請求會被誤判為跨來源而回 403 Invalid CORS request。
        # 之後若在前面加上處理 HTTPS 的負載平衡器，要連同 X-Forwarded-Port 一起設定。
    }

    # Vite 打包的檔名含雜湊，可以長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Google 登入（GIS）在 http://localhost 測試時要求 no-referrer-when-downgrade。
    # 路由在 # 之後，不會隨 Referer 送出；location 裡有自己的 add_header 時不會繼承這裡的，所以 index.html 另外加
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # index.html 不快取，部署新版本後立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer-when-downgrade";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
