spring.application.name=backend

# 比照 Hexschool 的 /v2 前綴，前端以 VITE_APP_API_BASE=http://localhost:8080/v2 連線
server.servlet.context-path=/v2

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travfree}
spring.datasource.username=${DB_USERNAME:travfree}
spring.datasource.password=${DB_PASSWORD:travfree}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 金額與數量皆為整數，小數直接視為格式錯誤，不做無聲截斷
spring.jackson.deserialization.accept-float-as-int=false

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
# 超過上傳上限時仍要讀完請求，否則 Tomcat 會直接斷線，前端收不到 JSON 錯誤
server.tomcat.max-swallow-size=10MB

app.api-path=react-week2-api
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080/v2}
app.upload-dir=${UPLOAD_DIR:./uploads}

# 以下預設值僅供本機開發，部署時必須用環境變數覆寫
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-deployment-0123456789}
app.jwt.ttl=7d
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Test123456}

# 5173 是前端，8081 是 Swagger UI（npm run openapi:preview）的 Try it out
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081}
