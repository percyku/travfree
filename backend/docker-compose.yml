services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travfree
      POSTGRES_USER: travfree
      POSTGRES_PASSWORD: travfree
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travfree -d travfree"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
