# push 到 main 或開 PR 時自動檢查 spec、後端、前端，並以 docker compose 實際啟動一次、執行 E2E。說明見 docs/TESTING.md 的「CI」。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一個分支有新的 push 時，取消還在跑的舊檢查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spec:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run openapi:lint

  backend:
    name: 後端測試
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 使用 H2，不需要資料庫服務；契約測試會讀 ../docs/openapi.yaml
      - run: ./mvnw -B test
      - name: 上傳測試報告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: 前端 lint、測試與建置
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # MSW 模擬 API，並對 ../docs/openapi.yaml 檢查請求與回應
      - run: npm test
      - run: npm run build

  docker:
    name: Docker compose 與 E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 以 prod profile 啟動，密鑰每次隨機產生、只在這次執行使用
      - name: 產生臨時的 .env
        run: |
          db_password=$(openssl rand -hex 16)
          jwt_secret=$(openssl rand -base64 48 | tr -d '\n')
          admin_password=$(openssl rand -hex 12)
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          {
            echo "SPRING_PROFILES_ACTIVE=prod"
            echo "DB_PASSWORD=$db_password"
            echo "JWT_SECRET=$jwt_secret"
            echo "ADMIN_PASSWORD=$admin_password"
            # Google 登入以臨時的測試金鑰取代 Google（私鑰寫到 e2e/.google-test-key.pem 給 Playwright）
            echo "GOOGLE_CLIENT_ID=e2e-client.apps.googleusercontent.com"
            echo "GOOGLE_TEST_PUBLIC_KEY=$(scripts/google-test-key.sh)"
          } > .env
      - name: 建置並啟動
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: ADMIN_PASSWORD=$(sed -n 's/^ADMIN_PASSWORD=//p' .env) ./scripts/smoke-test.sh
      # 種子資料要能透過 API 匯入；第二次執行應全部略過，不會重複新增
      - name: 匯入種子資料
        run: |
          export ADMIN_PASSWORD=$(sed -n 's/^ADMIN_PASSWORD=//p' .env)
          npm run -s seed
          npm run -s seed | tee seed.txt
          grep -Eq '產品 0（略過 [1-9].*文章 0（略過 [1-9].*優惠券 0（略過 [1-9]' seed.txt
      # 展示會員與訂單走真實的註冊、購物車與結帳 API；第二次執行應略過
      - name: 匯入展示會員與訂單
        run: |
          export ADMIN_PASSWORD=$(sed -n 's/^ADMIN_PASSWORD=//p' .env)
          npm run -s seed:demo | tee demo.txt
          grep -q '新增訂單 2（略過 0）' demo.txt
          npm run -s seed:demo | tee demo.txt
          grep -q '新增訂單 0（略過 2）' demo.txt
      # 備份後清空資料庫再還原，種子資料應該都還在（再匯入一次全部略過）
      - name: 備份與還原
        run: |
          export ADMIN_PASSWORD=$(sed -n 's/^ADMIN_PASSWORD=//p' .env)
          npm run -s db:backup | tee backup.txt
          file=$(sed -n 's/^資料庫：//p' backup.txt)
          docker compose down -v
          docker compose up -d --wait
          npm run -s db:restore -- --yes "$file"
          npm run -s seed | tee seed.txt
          grep -Eq '產品 0（略過 [1-9].*文章 0（略過 [1-9].*優惠券 0（略過 [1-9]' seed.txt
          # 展示會員（含密碼）與他的訂單也還原了
          npm run -s seed:demo | tee demo.txt
          grep -q '新增訂單 0（略過 2）' demo.txt
      # 在真實瀏覽器走完主要流程（前台購物、會員、後台產品、後台訂單），測試在 e2e/
      # 在 Playwright 官方映像檔裡執行：瀏覽器與系統套件（含中文字型）都已裝好，不經過 Ubuntu 的 apt。
      # 原本的 playwright install --with-deps 要從 apt 安裝字型，2026-11-11 runner 解析不到
      # azure.archive.ubuntu.com，連續兩次卡 10 分鐘後失敗。映像檔版本取自 e2e/package-lock.json，升級時不必另外改。
      # 用 host 網路連到 compose 的 :8000；npm ci 在容器內執行，取得 Linux 版的 node_modules。
      - name: E2E 測試
        timeout-minutes: 15
        run: |
          version=$(node -p "require('./e2e/package-lock.json').packages['node_modules/@playwright/test'].version")
          docker run --rm --network host --ipc host \
            -v "$PWD/e2e:/e2e" -w /e2e \
            -e CI=true -e BASE_URL=http://localhost:8000 \
            -e ADMIN_PASSWORD="$(sed -n 's/^ADMIN_PASSWORD=//p' .env)" \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            sh -c 'npm ci --no-audit --no-fund && npx playwright test'
      - name: 上傳 E2E 報告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
      - name: 失敗時輸出 logs
        if: failure()
        run: docker compose logs --no-color
      - name: 清除
        if: always()
        run: docker compose down -v
